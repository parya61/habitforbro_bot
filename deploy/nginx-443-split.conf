# Разделение порта 443 по имени домена без расшифровки трафика.
map $ssl_preread_server_name $backend443 {
    sovanisova.ru       site;
    www.sovanisova.ru   site;
    default             vpn;
}

upstream site { server 127.0.0.1:8445; }
upstream vpn  { server 127.0.0.1:8444; }

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $backend443;
    proxy_protocol off;
    proxy_timeout 300s;
}
