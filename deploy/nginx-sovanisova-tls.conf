# HTTPS для sovanisova.ru напрямую с сервера, без Cloudflare.
# Порт 9443 — временный, для проверки. После освобождения станет 443.
server {
    listen 443 ssl http2;
    server_name sovanisova.ru www.sovanisova.ru;

    ssl_certificate     /etc/letsencrypt/live/sovanisova.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovanisova.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/sovanisova;
    index index.html;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }

    location / { try_files $uri $uri/ =404; }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|woff2|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
